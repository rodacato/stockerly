# i18n-tasks config (ADR-011). `i18n-tasks health` gates CI.
base_locale: es-MX
locales: [es-MX]

data:
  read:
    - config/locales/%{locale}.yml
  write:
    - config/locales/%{locale}.yml

search:
  paths:
    - app/
  relative_roots:
    - app/controllers
    - app/helpers
    - app/mailers
    - app/views
    - app/contexts

# Framework keys Rails resolves itself — present so `l()` renders es-MX, never
# referenced by a t() call, so `unused` must not flag them.
ignore_unused:
  # ADR-014 puts the phrase catalogue in the domain, so these keys are built by
  # AssetState.phrase_key rather than written literally — the scanner cannot see
  # them by design. asset_state_spec asserts every state resolves in both
  # readings, which is a stronger guarantee than the scan it replaces.
  - market.estado.*
  - date.*
  - time.*
  # Rails resolves these itself from time_ago_in_words; the scanner only
  # sees literal t() calls, so it reads the whole framework namespace as
  # unused.
  - datetime.*
  - number.*
  - support.*
  - errors.*
  - activerecord.*
  - helpers.*
