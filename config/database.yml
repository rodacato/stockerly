<%# The name is derived from the checkout directory so sibling git worktrees
    do not share databases — see Stockerly::Checkout and CONTRIBUTING.md. %>
<% prefix = Stockerly::Checkout.database_prefix %>

default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  primary:
    <<: *default
    database: <%= prefix %>_development
  cache:
    <<: *default
    database: <%= prefix %>_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= prefix %>_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= prefix %>_development_cable
    migrations_paths: db/cable_migrate

test:
  primary:
    <<: *default
    database: <%= prefix %>_test
  cache:
    <<: *default
    database: <%= prefix %>_test_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= prefix %>_test_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= prefix %>_test_cable
    migrations_paths: db/cable_migrate

production:
  primary:
    <<: *default
    url: <%= ENV["DATABASE_URL"] %>
  cache:
    <<: *default
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    database: stockerly_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    database: stockerly_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    host: <%= ENV.fetch("DB_HOST", "localhost") %>
    username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    database: stockerly_production_cable
    migrations_paths: db/cable_migrate
