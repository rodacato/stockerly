name: Deploy

on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      action:
        description: 'Kamal command (default `deploy`; pick `setup` for first-time bootstrap on a new host)'
        type: choice
        options:
          - deploy
          - setup
          - redeploy
        default: deploy

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  packages: write
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.action || 'deploy' }})
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    env:
      ACTION: ${{ inputs.action || 'deploy' }}
      DOCKER_BUILDKIT: 1
      KAMAL_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      HOST_IP: ${{ secrets.HOST_IP }}
      APP_HOST: ${{ vars.APP_HOST }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      METRICS_ENABLED: ${{ vars.METRICS_ENABLED || 'false' }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}

    steps:
      # master only takes PRs whose required checks passed on an up-to-date branch, so a
      # commit on master is a tested commit. Anything else never went through that gate.
      - name: Require a commit that is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/master...$GITHUB_SHA" --jq .status)
          case "$status" in
            identical|behind) ;;
            *) echo "::error::$GITHUB_SHA is not on master ($status); only merged commits deploy"; exit 1 ;;
          esac

      - name: Require HOST_IP and APP_HOST
        run: |
          [ -n "$HOST_IP" ] || { echo "::error::Set the HOST_IP secret on the production environment"; exit 1; }
          [ -n "$APP_HOST" ] || { echo "::error::Set the APP_HOST variable on the production environment"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan "$HOST_IP" >> ~/.ssh/known_hosts

      # Idempotent. Setup boots the accessories itself.
      - name: Boot accessories
        if: ${{ env.ACTION != 'setup' }}
        run: bin/kamal accessory boot all || true

      - name: Run kamal ${{ env.ACTION }}
        run: bin/kamal "$ACTION"
