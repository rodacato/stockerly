name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A merge group's run is the one the merge waits on. Cancelling it strands the
  # queue entry, so only pull-request runs are superseded by a newer push.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

permissions:
  contents: read

jobs:
  test:
    # Runs on pull requests, and on the merge group that the queue builds — which
    # is the merged tree itself, tested once for the whole batch instead of once
    # per branch per rebase. Skipped on push: master only takes what the queue or
    # an up-to-date PR already proved.
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Four shards, four runners. The suite has no hot spot to optimise — it is a
    # long tail of thousands of fast examples — so the only lever left is running
    # fewer of them per machine. fail-fast stays off: one shard's failure should
    # not hide the other three.
    strategy:
      fail-fast: false
      matrix:
        shard: [ 1, 2, 3, 4 ]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockerly
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stockerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: stockerly
      DATABASE_PASSWORD: test_password
      # Pin the database names so they do not follow the checkout directory here.
      DATABASE_PREFIX: stockerly
      # Nothing in a pull request reads the coverage report — Sonar runs its own
      # rspec on demand in quality.yml. Skipping it here is about a tenth of the run.
      COVERAGE: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Chrome for the cuprite system specs
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Build CSS
        run: bin/rails tailwindcss:build

      - name: Run tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          SHARDS: "4"
          SHARD: ${{ matrix.shard }}
        run: bundle exec rspec $(ruby script/spec_shard.rb)

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  resolve_python:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up the Python the production image runs
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The image resolves these in a venv with no compiler, so the gate does too:
      # a bad pin fails here rather than halfway through a Kamal deploy.
      - name: Resolve the Python requirements the way the image builds them
        run: |
          python -m venv --upgrade-deps /tmp/gate
          /tmp/gate/bin/pip install --dry-run --only-binary=:all: -r lib/python/requirements.txt

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Check the locale catalogue for missing, unused and unnormalized keys
        run: bundle exec i18n-tasks health

      - name: Check the ADR conventions a grep can see
        run: bin/checks
