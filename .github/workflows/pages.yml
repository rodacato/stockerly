name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "design/exports/**"
      - "design/brand/**"
      - "lib/stockerly/version.rb"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Stamp the version the repo declares
        run: |
          set -euo pipefail
          v="$(sed -nE 's/.*VERSION = "([^"]+)".*/\1/p' lib/stockerly/version.rb)"
          [ -n "$v" ] || { echo "lib/stockerly/version.rb yielded no version" >&2; exit 1; }
          for f in site/index.html site/en.html; do
            sed -i "s|data-version>[^<]*|data-version>$v|g" "$f"
            grep -qF "data-version>$v<" "$f" || { echo "$f did not take the stamp" >&2; exit 1; }
          done
          echo "stamped $v"

      - name: Stage the design assets the page references
        run: |
          set -euo pipefail
          mkdir -p site/img site/brand
          while read -r f; do
            cp "design/exports/$f" "site/img/$f"
          done <<< "$(grep -oE '(src|srcset)="img/[^"]+"' site/index.html \
                      | sed -E 's/.*"img\///; s/"$//' | sort -u)"
          cp design/brand/glyph.svg design/brand/wordmark.svg site/brand/
          cp public/og-image.png site/og-image.png
          du -sh site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
