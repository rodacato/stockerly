name: Site · Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "design/brand/**"
      - "app/assets/tailwind/application.css"
      - "app/shared/domain/brand_assets.rb"
      - "bin/brand-preview"
      - "public/brand/**"
      - "public/*icon*"
      - "public/*image*.png"
      - "public/github-social-preview*.png"
      - "lib/stockerly/version.rb"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Build Pages from the shared presentation and application tokens
        run: |
          bin/rails tailwindcss:build
          bin/brand-preview --site

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
