name: Site · Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "design/brand/**"
      - "app/assets/tailwind/application.css"
      - "app/shared/domain/brand_assets.rb"
      - "bin/brand-preview"
      - "public/brand/**"
      - "public/*icon*"
      - "public/*image*.png"
      - "public/github-social-preview*.png"
      - "lib/stockerly/version.rb"
      - ".github/workflows/site-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build Pages from the shared presentation and application tokens
        run: |
          bin/rails tailwindcss:build
          bin/brand-preview --site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
