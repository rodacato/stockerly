name: Quality

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Report-only: findings show in the job log without failing the check.
  # Set to "true" to make Semgrep, Trivy and Gitleaks block a merge.
  SECURITY_BLOCKING: "false"

jobs:
  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        run: semgrep scan --config p/default --config p/security-audit --error

  trivy:
    name: trivy (deps + secrets + IaC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: ${{ env.SECURITY_BLOCKING != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Free for personal accounts; a repo under an organization needs this secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  sonar:
    # Opt-in and manual: runs on "Run workflow" only, and only where a SonarQube
    # server is configured (SONAR_HOST_URL variable + SONAR_TOKEN secret). The suite
    # runs first so SimpleCov writes the report sonar-project.properties points at.
    if: ${{ github.event_name == 'workflow_dispatch' && vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stockerly
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: stockerly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_HOST: localhost
      DATABASE_USERNAME: stockerly
      DATABASE_PASSWORD: test_password
      # Pin the database names so they do not follow the checkout directory here.
      DATABASE_PREFIX: stockerly

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history → accurate "new code" / blame dates

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Install Chrome for the cuprite system specs
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Set up database
        run: bin/rails db:create db:schema:load

      - name: Build CSS
        run: bin/rails tailwindcss:build

      - name: Run tests with coverage
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bundle exec rspec

      - name: SonarQube scan
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        with:
          args: -Dsonar.projectVersion=${{ github.sha }}
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
