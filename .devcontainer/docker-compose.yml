services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # tini as PID 1 — `sleep infinity` never reaps, so git/node/claude zombies pile up.
    init: true
    volumes:
      - ..:/workspaces/stockerly:cached
      # The shell-history feature writes here (/dc/shellhistory, per its
      # devcontainer-feature.json); without the volume every rebuild starts empty.
      - commandhistory:/dc/shellhistory
    # .host.env comes from initialize.sh, local.env from you; the later file wins. See README.md.
    env_file:
      - path: .host.env
        required: false
      - path: local.env
        required: false
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
    command: sleep infinity
    depends_on:
      - db

  # No host port: the app reaches db over the compose network, and forwardPorts exposes it on a
  # free local port, so repos sharing a host never collide.
  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockerly_development

volumes:
  postgres_data:
  commandhistory:
