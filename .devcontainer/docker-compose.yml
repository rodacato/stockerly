name: stockerly-notdefined

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # tini as PID 1 — `sleep infinity` never reaps, so git/node/claude zombies pile up.
    init: true
    volumes:
      - ../..:/workspaces:cached
      - bundle_cache:/usr/local/bundle
      # The shell-history feature writes here (/dc/shellhistory, per its
      # devcontainer-feature.json); without the volume every rebuild starts empty.
      - commandhistory:/dc/shellhistory
    ports:
      - "4100:4100"
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      RAILS_ENV: development
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "6543:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stockerly_development

volumes:
  postgres_data:
  bundle_cache:
  commandhistory:
