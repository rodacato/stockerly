inherit_from: .rubocop_todo.yml

# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Omakase is formatting only. Every department below catches defects rather than
# opining on style, which is the line this file draws — 230 of RuboCop's 796 cops.
#
# Turning on Rails, Performance and Migration found 250 offenses in 141 files.
# They are frozen in .rubocop_todo.yml so new code is held to the rule while the
# backlog is burned down. That file is debt to shrink, not a permanent exemption:
# a cop that stays in it forever should be disabled here, with the reason.
Lint:
  Enabled: true
Security:
  Enabled: true
Rails:
  Enabled: true
Performance:
  Enabled: true
Migration:
  Enabled: true

# Both of these assume every receiver is an ActiveRecord relation, and the domain
# layer is full of plain Ruby classes that answer to the same names. Their
# autocorrections raise: AssetCatalog.find_by_symbols is a select over an array,
# and MetricDefinitions.all is its own registry, not a scope.
Rails/DynamicFindBy:
  Enabled: false

Rails/RedundantActiveRecordAllMethod:
  Enabled: false

# Same assumption, two more shapes of it. MetricDefinitions is a registry with
# its own `all`, so `find_each` is not on it, and every `errors.to_h` flagged
# here belongs to a Dry::Validation result, where it is the documented API.
Rails/FindEach:
  Exclude:
    - 'spec/contexts/market_data/domain/metric_definitions_spec.rb'

Rails/DeprecatedActiveModelErrorsMethods:
  Enabled: false

# PwaController inherits ActionController::Base on purpose: the manifest and the
# service worker are fetched outside any session, and ApplicationController would
# put authentication, setup and maintenance filters back in front of them.
Rails/ApplicationController:
  Exclude:
    - 'app/controllers/pwa_controller.rb'

# response.parsed_body dispatches on Content-Type, so it is not a drop-in for
# JSON.parse(response.body): the manifest is served as application/manifest+json
# and comes back a String, which then answers `["short_name"]` with a substring.
Rails/ResponseParsedBody:
  Exclude:
    - 'spec/requests/pwa_spec.rb'

# TOTP is defined on Unix time (RFC 6238), so the step counter is derived from
# Time.now.to_i on purpose. A zone here would say the opposite of what it means.
Rails/TimeZone:
  Exclude:
    - 'app/contexts/identity/use_cases/enable_totp.rb'
    - 'app/contexts/identity/use_cases/verify_totp_code.rb'
    - 'app/controllers/two_factor_controller.rb'
    - 'app/helpers/totp_helper.rb'
    - 'spec/contexts/identity/domain/totp_spec.rb'
    - 'spec/contexts/market_data/gateways/alpaca_gateway_spec.rb'

# The QR is rendered from the provisioning URI in-process (ADR-019); the SVG is
# generated here, not received, so there is no untrusted markup to escape.
Rails/OutputSafety:
  Exclude:
    - 'app/helpers/totp_helper.rb'

# Each of these writes a mapping and its default in full, and the default
# repeats a branch on purpose — reading `when "Equity" then "EQUITY"` beside
# `else "EQUITY"` is the point. The breaker's is a state machine, where folding
# :half_open into :open's timeout branch would hide the transition.
Lint/DuplicateBranch:
  Exclude:
    - 'app/shared/domain/circuit_breaker.rb'
    - 'app/contexts/market_data/gateways/alpha_vantage_gateway.rb'
    - 'app/helpers/fundamentals_helper.rb'
    - 'app/helpers/statements_helper.rb'

# Per-request memoisation, which is what an instance variable is for in a helper
# that a partial calls once per row.
Rails/HelperInstanceVariable:
  Exclude:
    - 'app/helpers/alerts_helper.rb'

# Hoisting a literal out of a loop buys nothing in an example that runs once.
Performance/CollectionLiteralInLoop:
  Exclude:
    - 'spec/**/*'

# Read one by one, and every one is deliberate. Two shapes: bookkeeping that must
# not fail — recording a sync error through a validation would lose the error it
# is recording — and bulk writes where per-row validation is the wrong shape.
# The cop stays on so a new file has to justify itself.
Rails/SkipsModelValidations:
  Exclude:
    - 'spec/**/*'
    # A backfill runs against the schema of its own moment, where the model class
    # may not match the table it is writing.
    - 'db/migrate/**/*'
    - 'app/contexts/administration/use_cases/errors/record_error.rb'
    - 'app/contexts/market_data/gateways/fx_rates_gateway.rb'
    - 'app/contexts/notifications/domain/web_push_delivery.rb'
    - 'app/contexts/notifications/use_cases/mark_as_read.rb'
    - 'app/jobs/sync_bulk_bmv_job.rb'
    - 'app/jobs/sync_integration_job.rb'
    - 'app/jobs/sync_market_indices_job.rb'
    - 'app/jobs/sync_single_asset_job.rb'
    - 'app/models/fx_rate_history.rb'
    - 'app/models/integration.rb'
    - 'lib/tasks/fx_rate_backfill.rake'

# It is right that `2.minutes.ago` in a constant is evaluated once, and that is
# exactly what a seed script wants. Its autocorrection turns the constant into a
# method, which the script below then cannot reference.
Rails/RelativeDateConstant:
  Exclude:
    - 'db/seeds.rb'

# Seeds report progress to whoever ran them. Rails.logger is not where a person
# watching `db:seed` is looking.
Rails/Output:
  Exclude:
    - 'db/seeds.rb'
    - 'db/seeds/**/*'

# A new defect-catching cop should arrive enabled rather than wait to be noticed.
# The cost is that a rubocop bump can fail CI — which is where it should fail.
AllCops:
  NewCops: enable

# The gateway base classes define no initialize, so super would only reach
# Object's. The adapters are not skipping parent state; there is none.
Lint/MissingSuper:
  Enabled: false

Lint/UnusedMethodArgument:
  Exclude:
    # Implements Rails.error's subscriber signature; the keywords it does not
    # read cannot be renamed without breaking the contract.
    - app/contexts/administration/handlers/record_unhandled_error.rb

Lint/UnusedBlockArgument:
  Exclude:
    # A double impersonating a signature has to keep the keyword names it
    # answers to, unused or not.
    - spec/**/*

Lint/ConstantDefinitionInBlock:
  Exclude:
    # Fixture data scoped to the example group that reads it.
    - spec/**/*
