inherit_from: .rubocop_todo.yml

# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Omakase is formatting only. Every department below catches defects rather than
# opining on style, which is the line this file draws — 230 of RuboCop's 796 cops.
#
# Turning on Rails, Performance and Migration found 250 offenses in 141 files.
# They are frozen in .rubocop_todo.yml so new code is held to the rule while the
# backlog is burned down. That file is debt to shrink, not a permanent exemption:
# a cop that stays in it forever should be disabled here, with the reason.
Lint:
  Enabled: true
Security:
  Enabled: true
Rails:
  Enabled: true
Performance:
  Enabled: true
Migration:
  Enabled: true

# Both of these assume every receiver is an ActiveRecord relation, and the domain
# layer is full of plain Ruby classes that answer to the same names. Their
# autocorrections raise: AssetCatalog.find_by_symbols is a select over an array,
# and MetricDefinitions.all is its own registry, not a scope.
Rails/DynamicFindBy:
  Enabled: false

Rails/RedundantActiveRecordAllMethod:
  Enabled: false

# A new defect-catching cop should arrive enabled rather than wait to be noticed.
# The cost is that a rubocop bump can fail CI — which is where it should fail.
AllCops:
  NewCops: enable

# The gateway base classes define no initialize, so super would only reach
# Object's. The adapters are not skipping parent state; there is none.
Lint/MissingSuper:
  Enabled: false

Lint/UnusedMethodArgument:
  Exclude:
    # Implements Rails.error's subscriber signature; the keywords it does not
    # read cannot be renamed without breaking the contract.
    - app/contexts/administration/handlers/record_unhandled_error.rb

Lint/UnusedBlockArgument:
  Exclude:
    # A double impersonating a signature has to keep the keyword names it
    # answers to, unused or not.
    - spec/**/*

Lint/ConstantDefinitionInBlock:
  Exclude:
    # Fixture data scoped to the example group that reads it.
    - spec/**/*
