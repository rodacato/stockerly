# What the conventions in script/checks/ already find on master, so each one can
# be green while still failing anything new. Same bargain as .rubocop_todo.yml:
# debt to shrink, not a permanent exemption. A row whose count the code has
# fallen below is reported as stale — trim it rather than leave it padding.
#
# `count` is per file. Exceed it and the run fails.

design-tokens:
  # #489 counted these; #548 migrated the opacity modifiers around them and #561
  # the tail. The helpers and the Stimulus controllers hold state colours that
  # never got a semantic token; the two market charts inline an SVG palette;
  # legal/ and shared/ carry amber warning boxes older than the token set.
  # Three controllers left the tree in #561 because nothing mounted them, taking
  # onboarding_form_controller.js and selectable_card_controller.js off this list.
  app/helpers/alerts_helper.rb:
    count: 6
  app/helpers/earnings_helper.rb:
    count: 4
  app/helpers/market_helper.rb:
    count: 11
  app/helpers/notifications_helper.rb:
